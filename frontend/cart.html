<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>

<h2>Your Cart</h2>
<div id="cart"></div>

<!-- ✅ BUTTON OUTSIDE SCRIPT -->
<button onclick="checkout()">Proceed to Payment</button>

<script src="script.js"></script>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

fetch("http://127.0.0.1:5000/products")
.then(res => res.json())
.then(products => {
    let selected = products.filter(p => cart.includes(p.id));

    let container = document.getElementById("cart");
    let total = 0;

    selected.forEach(p => {
        total += p.price;

        container.innerHTML += `
        <p>
            ${p.name} - ₹${p.price}
            <button onclick="removeFromCart(${p.id})">Remove</button>
        </p>`;
    });

    container.innerHTML += `<h3>Total: ₹${total}</h3>`;
});
</script>

</body>
</html>
